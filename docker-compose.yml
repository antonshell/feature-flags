# Local development and CI tests. Production uses the `prod` target of the same Dockerfile (see deploy/compose.yml).
services:
  app:
    build:
      context: .
      target: dev
    # run as the host user so files created in the bind mount (vendor/, var/, coverage/) are yours
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # tests use the same server, database name + "_test" suffix (config/packages/test/doctrine.yaml)
      DATABASE_URL: mysql://root:root@database:3306/feature_flags
      # coverage is needed for `composer test`; use "debug,coverage" for step debugging
      XDEBUG_MODE: ${XDEBUG_MODE:-coverage}
      PHP_IDE_CONFIG: serverName=Docker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/app
    ports:
      - "16580:8080"

  # Same image as in production (deploy/compose.yml)
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: feature_flags
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "16506:3306"

  # API docs: docker compose --profile swagger up
  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./swagger/openapi.yaml:/openapi.yaml:ro
    ports:
      - "16582:8080"
    profiles: [swagger]

volumes:
  db-data:
