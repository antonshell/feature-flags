# Production stack. Lives on the server in $DEPLOY_PATH together with a .env file
# (APP_IMAGE, APP_SECRET, ROOT_TOKEN, DB_PASSWORD) written by the GitHub Actions deploy job.
#
# The database is not attached to "web": Caddy and other projects can't reach it. Its port is published
# only on the server's localhost (127.0.0.1:26506) for access via an SSH tunnel (README → Database access).
# Its data lives in the external volume feature-flags_db-data: created once by hand
# (docker volume create feature-flags_db-data), never created or removed by compose.
name: feature-flags

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is not set}
    container_name: feature-flags
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is not set}
      ROOT_TOKEN: ${ROOT_TOKEN:?ROOT_TOKEN is not set}
      # DB_PASSWORD goes into a URL: use a URL-safe value (openssl rand -hex 24)
      DATABASE_URL: mysql://feature_flags:${DB_PASSWORD:?DB_PASSWORD is not set}@database:3306/feature_flags?charset=utf8mb4
    networks:
      - default
      - web

  database:
    # keep the version in sync with server_version in config/packages/doctrine.yaml
    image: mariadb:11.4
    container_name: feature-flags-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: feature_flags
      MARIADB_USER: feature_flags
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      # root is not needed by the app; the app user owns the feature_flags database
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      # minor version upgrades of the image upgrade the system tables on start
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      # Only on the server's localhost: reachable via an SSH tunnel, never from the internet.
      # Never drop the 127.0.0.1 prefix: docker publishes ports past ufw/iptables rules.
      # Port convention: 1PPSS locally, 2PPSS on the server (PP = project, SS = service:
      # 80 http, 06 mysql/mariadb, 82 swagger). 26506 = production database of feature-flags.
      - "127.0.0.1:26506:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    volumes:
      - db-data:/var/lib/mysql

volumes:
  # External: `docker compose down -v` doesn't delete it, and if it is missing, deploy fails
  # instead of silently starting with an empty database.
  db-data:
    external: true
    name: feature-flags_db-data

networks:
  web:
    external: true
    name: ${CADDY_NETWORK:-web}
