name: CI

# lint, audit and tests run on every push.
# On master: the image is built in parallel, and deploy runs only when lint, tests and build
# are green (audit only reports, it never blocks).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ———————————————————————————————————————————————————————————————————————————
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --diff --dry-run

  # ———————————————————————————————————————————————————————————————————————————
  # Known vulnerabilities in dependencies. Reads only the lock file — nothing is installed.
  # Informational: findings are reported as warnings (annotation + job summary) but never block
  # merging or deploy — advisories often appear before a fixed version exists.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Composer audit
        id: composer-audit
        continue-on-error: true
        run: composer audit --locked

      - name: Report findings
        if: steps.composer-audit.outcome == 'failure'
        run: |
          echo "::warning title=composer audit::Known vulnerabilities in composer dependencies, see the audit job log"
          echo "⚠️ **composer audit** found known vulnerabilities — see the log of the corresponding step." >> "$GITHUB_STEP_SUMMARY"

  # ———————————————————————————————————————————————————————————————————————————
  # Tests run in the dev image against MariaDB from docker-compose.yml (the same image as in production).
  # Same commands as locally.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Run containers as the runner user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the dev image
        run: docker compose build app

      - name: Start the database
        run: docker compose up -d --wait database

      - name: Install Composer dependencies
        run: docker compose run --rm app composer install --no-interaction --no-progress

      - name: Check Symfony requirements
        run: docker compose run --rm app vendor/bin/requirements-checker

      - name: Prepare the test database
        run: docker compose run --rm app composer init-testing-environment

      - name: Run functional and unit tests
        run: docker compose run --rm app composer test

      # —— Coverage report: job summary + downloadable HTML artifact ————————
      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          docker compose run --rm --no-deps -e GITHUB_WORKSPACE=/app app \
            php .github/scripts/coverage-summary.php coverage.xml "Code coverage" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Full HTML report: download the **coverage** artifact of this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
            coverage.xml
          retention-days: 30

      - name: Check test coverage
        uses: johanvanhelden/gha-clover-test-coverage-check@v1
        with:
          percentage: "95"
          filename: "coverage.xml"

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ———————————————————————————————————————————————————————————————————————————
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      backup-image: ${{ steps.image.outputs.backup }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # both images go to the same GHCR package: the app as sha-<commit>, the backup cron container as backup-sha-<commit>
      - name: Image references
        id: image
        run: |
          echo "ref=${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "backup=${REGISTRY}/${IMAGE_NAME,,}:backup-sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true   # into the local docker daemon: smoke-tested first, pushed only if it passes
          tags: ${{ steps.image.outputs.ref }}
          # one image = one package version (no attestation manifests),
          # so the retention cleanup below can't delete parts of a kept image
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup
          load: true
          tags: ${{ steps.image.outputs.backup }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      # with a real MariaDB: migrations from an empty database, writes and reads through the API,
      # a backup dump + upload with the backup image
      - name: Smoke test
        run: .github/scripts/smoke-test.sh "${{ steps.image.outputs.ref }}" "${{ steps.image.outputs.backup }}"

      - name: Push images
        run: |
          docker push "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.backup }}"

  # ———————————————————————————————————————————————————————————————————————————
  # Order on the server: database up → backup → migrations (with the new image) → switch the app and backup containers.
  # If the backup or a migration fails, the old app container keeps running.
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [lint, tests, build]   # not audit: it is informational
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read   # GITHUB_TOKEN is used on the server to pull the private image from GHCR
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Backup, migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          BACKUP_IMAGE: ${{ needs.build.outputs.backup-image }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ROOT_TOKEN: ${{ secrets.ROOT_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,BACKUP_IMAGE,APP_SECRET,ROOT_TOKEN,DB_PASSWORD,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            umask 077
            printf 'APP_IMAGE=%s\nBACKUP_IMAGE=%s\nAPP_SECRET=%s\nROOT_TOKEN=%s\nDB_PASSWORD=%s\nHOST_UID=%s\nHOST_GID=%s\n' \
              "$APP_IMAGE" "$BACKUP_IMAGE" "$APP_SECRET" "$ROOT_TOKEN" "$DB_PASSWORD" "$(id -u)" "$(id -g)" > .env
            # .backup.env is optional (Spaces credentials, created by hand): compose needs the file to exist
            touch .backup.env
            mkdir -p backups
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --wait database
            # dump before migrations with the new backup image;
            # exit code 3 = the dump is created locally, only the upload to Spaces failed: deploy goes on
            docker compose run --rm --no-deps backup backup \
              || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; echo "::warning::backup upload to Spaces failed"; }
            docker compose run --rm --no-deps app \
              php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            docker compose up -d --remove-orphans
            docker image prune -f
            healthy=no
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' feature-flags)" = healthy ] && { healthy=yes; break; }
              sleep 2
            done
            [ "$healthy" = yes ] || { echo "feature-flags did not become healthy"; docker compose logs --tail=100 app; exit 1; }
            echo "feature-flags is healthy"
            # backup container has no healthcheck: make sure supercronic stays up (it exits on a broken crontab)
            sleep 3
            [ "$(docker inspect -f '{{.State.Status}}' feature-flags-backup)" = running ] \
              || { echo "feature-flags-backup is not running"; docker compose logs --tail=50 backup; exit 1; }
            echo "feature-flags-backup is running"

  # ———————————————————————————————————————————————————————————————————————————
  # Keep the 20 most recent package versions in GHCR = 10 deploys (app + backup image each, rollback targets).
  cleanup-images:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 20
