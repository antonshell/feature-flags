# Publishes swagger/openapi.yaml as Swagger UI to GitHub Pages: https://antonshell.github.io/feature-flags/swagger-ui/
name: Swagger UI
on:
  push:
    branches:
      - master
    paths:
      - swagger/openapi.yaml
      - .github/workflows/swagger_ui.yml
  workflow_dispatch:

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Swagger UI
        uses: Legion2/swagger-ui-action@v1
        with:
          output: swagger-ui
          spec-file: swagger/openapi.yaml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: swagger-ui
          destination_dir: docs/swagger-ui
